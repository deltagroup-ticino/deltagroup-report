<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#15803D" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DR Report" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192-v3.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512-v3.png" />
    <link rel="apple-touch-icon" href="/icon-192-v3.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192-v3.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512-v3.png" />
    <link rel="apple-touch-icon-precomposed" href="/icon-192-v3.png" />
    <title>DELTAgroup REPORT</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f5f5f5;
        overscroll-behavior: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        user-select: none;
      }
      /* I campi di input devono restare selezionabili/scrivibili */
      input, textarea, select { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
      input, textarea, select, button { font-family: inherit; }
      /* Disattiva il menu "Salva immagine" su long-press */
      img { -webkit-touch-callout: none; -webkit-user-drag: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>
  </body>
</html>
